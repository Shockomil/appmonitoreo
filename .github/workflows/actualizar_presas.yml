name: Actualizador Diario de Presas CONAGUA

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 AM y 06:00 PM (hora UTC)
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar script de actualización de presas
        run: node scripts/actualizarPresas.js

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add presas_sinaloa.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualizacion de datos de presas Sinaloa" && git push)
